name: 🚀 Publish

on:
  release:
    types: [created]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version:
          - 22.x
          - 24.x
    services:
      elasticmq:
        image: softwaremill/elasticmq
        options: -p 9324:9324 --name elasticmq
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: ElasticMQ Configuration
        run: |
          cp ${{ github.workspace }}/.github/build/elasticmq.conf /tmp/elasticmq.conf
          docker cp /tmp/elasticmq.conf elasticmq:/opt/elasticmq.conf
          docker restart elasticmq

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        name: Use Node.js ${{ matrix.node-version }}
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit Tests
        run: pnpm run test

      - name: E2E Tests
        run: pnpm run test:e2e


  publish-npm:
    runs-on: ubuntu-24.04
    needs: test
    permissions:
      contents: read
      id-token: write # required for npm OIDC trusted publishing + provenance
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Ensure npm supports trusted publishing (OIDC)
        run: npm install -g npm@latest

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: 📝 Set version from release tag
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: pnpm version "${TAG_NAME#v}" --no-git-tag-version --allow-same-version

      - name: 🏗️ Build
        run: pnpm build

      - name: 🏷️ Resolve dist-tag from version
        id: disttag
        run: |
          TAG=$(node -p "const v=require('./package.json').version; const m=/-([0-9A-Za-z]+)/.exec(v); m ? m[1] : 'latest'")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $(node -p "require('./package.json').version") with dist-tag: $TAG"

      - name: 🚀 Publish to npm (OIDC + provenance)
        run: npm publish --provenance --access public --tag "${{ steps.disttag.outputs.tag }}"
